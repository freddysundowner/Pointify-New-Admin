openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pointify super-admin panel API (proxies the Pointify POS API)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: analytics
    description: Dashboard analytics
  - name: admins
    description: Platform users (shop owners)
  - name: shops
    description: Shops and shop categories
  - name: products
    description: Products and product categories
  - name: attendants
    description: Shop attendants
  - name: sales
    description: Sales
  - name: purchases
    description: Purchases
  - name: packages
    description: Subscription packages
  - name: subscriptions
    description: Subscriptions
  - name: sms
    description: SMS and bulk messaging
  - name: settings
    description: Global settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in as a Pointify admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Aggregated dashboard metrics (revenue, shops, users)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /statistics:
    get:
      operationId: getStatistics
      tags: [analytics]
      summary: Comprehensive platform business statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsResult"

  /statistics/revenue:
    get:
      operationId: getRevenueRange
      tags: [analytics]
      summary: Subscription revenue total for an arbitrary date range
      parameters:
        - { name: from, in: query, required: true, description: "Start date (inclusive), YYYY-MM-DD (UTC day boundary, matching upstream summary buckets)", schema: { type: string } }
        - { name: to, in: query, required: true, description: "End date (inclusive), YYYY-MM-DD (UTC day boundary, matching upstream summary buckets)", schema: { type: string } }
      responses:
        "200":
          description: Revenue for the requested date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueRange"

  /admins:
    get:
      operationId: listAdmins
      tags: [admins]
      summary: List platform users (shop owners)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: search, in: query, description: "Search by username, email or phone", schema: { type: string } }
        - { name: affliate, in: query, description: "Filter to users referred by this partner", schema: { type: string } }
        - { name: from, in: query, description: "Registration date from (YYYY-MM-DD, inclusive)", schema: { type: string } }
        - { name: to, in: query, description: "Registration date to (YYYY-MM-DD, inclusive)", schema: { type: string } }
      responses:
        "200":
          description: Admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResult"

  /admins/by-subscription:
    get:
      operationId: listAdminsBySubscription
      tags: [admins]
      summary: List users filtered by subscription status/type
      parameters:
        - { name: subscriptionStatus, in: query, schema: { type: string, enum: [active, expired] } }
        - { name: subscriptionType, in: query, schema: { type: string, enum: [trial, production] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Admins by subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriptionListResult"

  /admins/{id}:
    get:
      operationId: getAdmin
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
    put:
      operationId: updateAdmin
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdate"
      responses:
        "200":
          description: Updated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
    delete:
      operationId: deleteAdmin
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /admins/{id}/shops:
    get:
      operationId: listAdminShops
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shops owned by the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopListResult"

  /admins/{id}/reset-password:
    post:
      operationId: resetAdminPassword
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPassword"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"

  /shop-categories:
    get:
      operationId: listShopCategories
      tags: [shops]
      responses:
        "200":
          description: Shop categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopCategory" }
    post:
      operationId: createShopCategory
      tags: [shops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopCategoryInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopCategory" }

  /shop-categories/{id}:
    put:
      operationId: updateShopCategory
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopCategory" }
    delete:
      operationId: deleteShopCategory
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Partners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerListResult" }
    post:
      operationId: createPartner
      tags: [partners]
      summary: Register a new partner (affiliate)
      description: >-
        Creates a partner via the upstream affiliate registration, which hashes
        the password (auto-generating one when omitted) and emails the partner a
        welcome message with their credentials. A duplicate email returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerCreateInput" }
      responses:
        "201":
          description: Partner created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerRegisterResult" }
        "400":
          description: Duplicate email or invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
    put:
      operationId: updatePartner
      tags: [partners]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerUpdate" }
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
    delete:
      operationId: deletePartner
      tags: [partners]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }

  /partners/transactions:
    get:
      operationId: listPartnerTransactions
      tags: [partners]
      summary: Subscription earnings and withdrawals for a partner
      parameters:
        - { name: id, in: query, required: true, description: "Partner (affiliate) id", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Partner transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionListResult" }

  /portal/auth/register:
    post:
      operationId: portalRegister
      tags: [portal]
      summary: Partner self-registration
      description: >-
        Public endpoint. Creates a partner via the upstream affiliate
        registration (hashes the password, generates a referral code, and emails
        a welcome message) and returns an auth token plus the partner profile. A
        duplicate email returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalRegisterInput" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAuthResult" }
        "400":
          description: Duplicate email or invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/auth/login:
    post:
      operationId: portalLogin
      tags: [portal]
      summary: Partner login
      description: Public endpoint. Returns an auth token and the partner profile. Suspended accounts are rejected upstream.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAuthResult" }
        "401":
          description: Invalid credentials or suspended account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/me:
    get:
      operationId: getPortalProfile
      tags: [portal]
      summary: The authenticated partner's own profile
      responses:
        "200":
          description: Partner profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updatePortalProfile
      tags: [portal]
      summary: Update the authenticated partner's own profile or password
      description: >-
        Updates the calling partner only (id is taken from the auth token, never
        the client). Account-control fields (wallet, commission, blocked, active,
        code) are ignored. Setting a password triggers an upstream confirmation
        email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalProfileUpdate" }
      responses:
        "200":
          description: Updated partner profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/summary:
    get:
      operationId: getPortalSummary
      tags: [portal]
      summary: Dashboard totals for the authenticated partner
      responses:
        "200":
          description: Partner dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSummary" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/shops:
    get:
      operationId: listPortalShops
      tags: [portal]
      summary: Shops owned by users the authenticated partner referred
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Shops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopListResult" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/users:
    get:
      operationId: listPortalUsers
      tags: [portal]
      summary: Users (shop owners) the authenticated partner referred
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Referred users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListResult" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/transactions:
    get:
      operationId: listPortalTransactions
      tags: [portal]
      summary: Earnings and withdrawals for the authenticated partner
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Partner transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionListResult" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal/withdraw:
    post:
      operationId: requestPortalWithdrawal
      tags: [portal]
      summary: Request a wallet withdrawal (M-Pesa payout)
      description: >-
        Initiates a real M-Pesa payout from the authenticated partner's wallet to
        the given phone number. The affiliate id is taken from the auth token.
        Insufficient balance or a blocked account is reported in the response body
        with status false (HTTP 200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalWithdrawInput" }
      responses:
        "200":
          description: Withdrawal result (check status field)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalWithdrawResult" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /shops:
    get:
      operationId: listShops
      tags: [shops]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: subscriptionStatus, in: query, schema: { type: string, enum: [active, expired] } }
        - { name: subscriptionType, in: query, schema: { type: string, enum: [trial, production] } }
        - { name: ownerid, in: query, schema: { type: string } }
        - { name: affliate, in: query, description: "Filter to shops owned by users referred by this partner", schema: { type: string } }
      responses:
        "200":
          description: Shops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopListResult" }
    post:
      operationId: createShop
      tags: [shops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /shops/stats:
    get:
      operationId: getShopStats
      tags: [shops]
      summary: Shop metrics
      responses:
        "200":
          description: Shop stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }

  /shops/{id}:
    get:
      operationId: getShop
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
    put:
      operationId: updateShop
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
    delete:
      operationId: deleteShop
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /product-categories:
    get:
      operationId: listProductCategories
      tags: [products]
      responses:
        "200":
          description: Product categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductCategory" }

  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - { name: shopid, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: shop, in: query, schema: { type: string } }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResult" }
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    put:
      operationId: updateProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /products/history/stock:
    get:
      operationId: listProductStockHistory
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Stock movement history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistoryResult" }

  /products/history/sales:
    get:
      operationId: listProductSalesHistory
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Sales history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesHistoryResult" }

  /products/history/purchases:
    get:
      operationId: listProductPurchasesHistory
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseHistoryResult" }

  /products/history/summary:
    get:
      operationId: getProductHistorySummary
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Product history summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductHistorySummary" }

  /attendants:
    get:
      operationId: listAttendants
      tags: [attendants]
      parameters:
        - { name: shopId, in: query, schema: { type: string } }
        - { name: adminId, in: query, schema: { type: string } }
        - { name: username, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: number } }
        - { name: limit, in: query, schema: { type: number } }
      responses:
        "200":
          description: Attendants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendantListResult"
    post:
      operationId: createAttendant
      tags: [attendants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendantInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attendant" }

  /attendants/{id}:
    get:
      operationId: getAttendant
      tags: [attendants]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attendant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attendant" }
    put:
      operationId: updateAttendant
      tags: [attendants]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
