components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenericObject:
      type: object
      additionalProperties: true

    Partner:
      type: object
      additionalProperties: true
      required: [_id]
      properties:
        _id: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phonenumber: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        commission: { type: ["number", "null"] }
        wallet: { type: ["number", "null"] }
        blocked: { type: ["boolean", "null"] }
        active: { type: ["boolean", "null"] }
        code: { type: ["string", "null"] }
        createAt: { type: ["string", "null"] }
        shopCount: { type: number }
        userCount: { type: number }
        shops:
          type: array
          items: { $ref: "#/components/schemas/GenericObject" }
        admins:
          type: array
          items: { $ref: "#/components/schemas/GenericObject" }

    PartnerCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string }
        phonenumber: { type: string }
        country: { type: string }
        commission: { type: number }
        password: { type: string }

    PartnerUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phonenumber: { type: string }
        address: { type: string }
        country: { type: string }
        commission: { type: number }
        password: { type: string }
        blocked: { type: boolean }
        active: { type: boolean }

    PartnerListResult:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Partner" }
        count: { type: number }
        totalPages: { type: number }
        currentPage: { type: number }

    PartnerRegisterResult:
      type: object
      additionalProperties: true
      properties:
        message: { type: string }
        status: { type: boolean }
        error: { type: string }
        token: { type: string }
        userdata: { $ref: "#/components/schemas/GenericObject" }

    Transaction:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        createdAt: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        affliateAmount: { type: ["number", "null"] }
        balance: { type: ["number", "null"] }
        transId: { type: ["string", "null"] }
        mpesaCode: { type: ["string", "null"] }
        type: { type: ["string", "null"], description: "withdraw or subscription" }
        status: { type: ["boolean", "null"] }
        user: { $ref: "#/components/schemas/GenericObject" }
        affliate: { $ref: "#/components/schemas/GenericObject" }

    TransactionListResult:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        count: { type: number }
        totalPages: { type: number }
        currentPage: { type: number }

    PortalRegisterInput:
      type: object
      required: [name, email, phonenumber, password]
      properties:
        name: { type: string }
        email: { type: string }
        phonenumber: { type: string }
        country: { type: string }
        password: { type: string }

    PortalProfileUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phonenumber: { type: string }
        address: { type: string }
        country: { type: string }
        password: { type: string }

    PortalAuthResult:
