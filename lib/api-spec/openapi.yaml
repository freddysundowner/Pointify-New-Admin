openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pointify super-admin panel API (proxies the Pointify POS API)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: analytics
    description: Dashboard analytics
  - name: admins
    description: Platform users (shop owners)
  - name: shops
    description: Shops and shop categories
  - name: products
    description: Products and product categories
  - name: attendants
    description: Shop attendants
  - name: sales
    description: Sales
  - name: purchases
    description: Purchases
  - name: packages
    description: Subscription packages
  - name: subscriptions
    description: Subscriptions
  - name: sms
    description: SMS and bulk messaging
  - name: settings
    description: Global settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in as a Pointify admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Aggregated dashboard metrics (revenue, shops, users)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /admins:
    get:
      operationId: listAdmins
      tags: [admins]
      summary: List platform users (shop owners)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: search, in: query, description: "Search by username, email or phone", schema: { type: string } }
        - { name: from, in: query, description: "Registration date from (YYYY-MM-DD, inclusive)", schema: { type: string } }
        - { name: to, in: query, description: "Registration date to (YYYY-MM-DD, inclusive)", schema: { type: string } }
      responses:
        "200":
          description: Admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResult"

  /admins/by-subscription:
    get:
      operationId: listAdminsBySubscription
      tags: [admins]
      summary: List users filtered by subscription status/type
      parameters:
        - { name: subscriptionStatus, in: query, schema: { type: string, enum: [active, expired] } }
        - { name: subscriptionType, in: query, schema: { type: string, enum: [trial, production] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Admins by subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriptionListResult"

  /admins/{id}:
    get:
      operationId: getAdmin
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
    put:
      operationId: updateAdmin
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdate"
      responses:
        "200":
          description: Updated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
    delete:
      operationId: deleteAdmin
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /admins/{id}/shops:
    get:
      operationId: listAdminShops
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shops owned by the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopListResult"

  /admins/{id}/reset-password:
    post:
      operationId: resetAdminPassword
      tags: [admins]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPassword"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"

  /shop-categories:
    get:
      operationId: listShopCategories
      tags: [shops]
      responses:
        "200":
          description: Shop categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopCategory" }
    post:
      operationId: createShopCategory
      tags: [shops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopCategoryInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopCategory" }

  /shop-categories/{id}:
    put:
      operationId: updateShopCategory
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopCategory" }
    delete:
      operationId: deleteShopCategory
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /shops:
    get:
      operationId: listShops
      tags: [shops]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: subscriptionStatus, in: query, schema: { type: string, enum: [active, expired] } }
        - { name: subscriptionType, in: query, schema: { type: string, enum: [trial, production] } }
        - { name: ownerid, in: query, schema: { type: string } }
      responses:
        "200":
          description: Shops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopListResult" }
    post:
      operationId: createShop
      tags: [shops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /shops/stats:
    get:
      operationId: getShopStats
      tags: [shops]
      summary: Shop metrics
      responses:
        "200":
          description: Shop stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }

  /shops/{id}:
    get:
      operationId: getShop
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
    put:
      operationId: updateShop
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
    delete:
      operationId: deleteShop
      tags: [shops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /product-categories:
    get:
      operationId: listProductCategories
      tags: [products]
      responses:
        "200":
          description: Product categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductCategory" }

  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - { name: shopid, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: shop, in: query, schema: { type: string } }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResult" }
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    put:
      operationId: updateProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /products/history/stock:
    get:
      operationId: listProductStockHistory
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Stock movement history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistoryResult" }

  /products/history/sales:
    get:
      operationId: listProductSalesHistory
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Sales history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesHistoryResult" }

  /products/history/purchases:
    get:
      operationId: listProductPurchasesHistory
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseHistoryResult" }

  /products/history/summary:
    get:
      operationId: getProductHistorySummary
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Product history summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductHistorySummary" }

  /attendants:
    get:
      operationId: listAttendants
      tags: [attendants]
      parameters:
        - { name: shopId, in: query, schema: { type: string } }
        - { name: adminId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Attendants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendantListResult"
    post:
      operationId: createAttendant
      tags: [attendants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendantInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attendant" }

  /attendants/{id}:
    get:
      operationId: getAttendant
      tags: [attendants]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attendant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attendant" }
    put:
      operationId: updateAttendant
      tags: [attendants]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendantUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attendant" }
    delete:
      operationId: deleteAttendant
      tags: [attendants]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      parameters:
        - { name: shopId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string } }
        - { name: endDate, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListResult" }

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }

  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      parameters:
        - { name: shopId, in: query, schema: { type: string } }
        - { name: supplierId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseListResult" }

  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageListResult"
    post:
      operationId: createPackage
      tags: [packages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }

  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Package
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
    put:
      operationId: updatePackage
      tags: [packages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
    delete:
      operationId: deletePackage
      tags: [packages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [Active, Expired, Cancelled] } }
        - { name: type, in: query, schema: { type: string, enum: [trial, production] } }
        - { name: shop, in: query, schema: { type: string } }
        - { name: shopname, in: query, schema: { type: string } }
        - { name: invoiceNo, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionListResult" }

  /subscriptions/summary:
    get:
      operationId: getSubscriptionSummary
      tags: [subscriptions]
      summary: Subscription revenue summary by period
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionSummary" }

  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

  /subscriptions/{id}/extend:
    put:
      operationId: extendSubscription
      tags: [subscriptions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionExtendInput" }
      responses:
        "200":
          description: Extended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }

  /sms/logs:
    get:
      operationId: listSmsLogs
      tags: [sms]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: phone, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: shopId, in: query, schema: { type: string } }
      responses:
        "200":
          description: SMS logs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmsLogListResult" }

  /sms/topup:
    post:
      operationId: topupSms
      tags: [sms]
      summary: Top up an admin's SMS wallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsTopupInput" }
      responses:
        "200":
          description: Topped up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }

  /sms/bulk:
    post:
      operationId: sendBulkSms
      tags: [sms]
      summary: Send a bulk SMS to an audience segment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkSmsInput" }
      responses:
        "200":
          description: Bulk SMS result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkSmsResult" }

  /communications:
    get:
      operationId: listCommunications
      tags: [sms]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
      responses:
        "200":
          description: Communications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationListResult" }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      parameters:
        - { name: type, in: query, schema: { type: string } }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
    post:
      operationId: saveSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenericObject:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    MessageResult:
      type: object
      properties:
        message:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResult:
      type: object
      properties:
        token: { type: string }
        expiresIn: { type: number }
        userdata: { $ref: "#/components/schemas/Admin" }

    Admin:
      type: object
      additionalProperties: true
      required: [_id]
      properties:
        _id: { type: string }
        email: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        pricingGroup: { type: ["string", "null"] }
        emailVerified: { type: ["boolean", "null"] }
        phoneVerified: { type: ["boolean", "null"] }
