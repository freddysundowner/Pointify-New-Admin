    post:
      operationId: topupSms
      tags: [sms]
      summary: Top up an admin's SMS wallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsTopupInput" }
      responses:
        "200":
          description: Topped up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }

  /sms/bulk:
    post:
      operationId: sendBulkSms
      tags: [sms]
      summary: Start a bulk SMS to an audience segment
      description: >-
        Enqueues a bulk SMS, deduplicated to one message per user. Upstream
        accepts the job and sends in the background, so a successful call returns
        202 with the recipient `total` and `status: "processing"`. When no users
        match the audience it returns 200 with `total: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkSmsInput" }
      responses:
        "200":
          description: No recipients matched the audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkSmsResult" }
        "202":
          description: Bulk SMS accepted and sending in the background
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkSmsResult" }
        "400":
          description: Invalid audience or missing message

